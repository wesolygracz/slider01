<!DOCTYPE html>
<html>
<head>
<style> 
* 
{ 
    box-sizing: border-box; 
}
body 
{ 
    margin: 0; 
}
.slider
{ 
    height: 100vh; 
    position: relative; 
}
.slider img 
{ 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}
button 
{ 
    position: absolute; 
    top: 50%; transform: translateY(-50%); 
    background: transparent; 
    border: none; 
    color: white; 
    font-size: 40px; 
    cursor: pointer; 
}
.prev { left: 20px; } 
.next { right: 20px; }

</style>
</head>

<body>
<div class="slider">
  <img id="image" src="https://picsum.photos/id/10/1920/1080">

  <button class="prev" onclick="change(-1)">←</button>
  <button class="next" onclick="change(1)">→</button>
</div>

<script>
let images=[
  "https://picsum.photos/id/10/1920/1080",
  "https://picsum.photos/id/20/1920/1080",
  "https://picsum.photos/id/30/1920/1080"
], i=0;

function change(n){
  i=(i+n+images.length)%images.length;
  image.src=images[i];
}
</script>
</body>
</html>
